[supervisord]
nodaemon=true

[program:flask]
command=conda run -n myenv gunicorn --config gunicorn_config.py flask_app:app
directory=/application
autostart=true
autorestart=true
stderr_logfile=/var/log/flask.err.log
stdout_logfile=/var/log/flask.out.log

[program:celery]
command=conda run -n myenv celery -A flask_app.celery worker --loglevel=info
directory=/application
autostart=true
autorestart=true
stderr_logfile=/var/log/celery.err.log
stdout_logfile=/var/log/celery.out.log
