<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Processing</title>
    <style>
        /* Your existing CSS styles here */

        /* Style for tabs */
        .tab {
            overflow: hidden;
            border: 1px solid #ccc;
            background-color: #f1f1f1;
        }

        /* Style the buttons inside the tab */
        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
        }

        /* Change background color of tabs on hover */
        .tab button:hover {
            background-color: #ddd;
        }

        /* Create an active/current tablink class */
        .tab button.active {
            background-color: #ccc;
        }

        /* Style the tab content */
        .tabcontent {
            display: none;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-top: none;
        }
    </style>
</head>
<body>
    <header>
        <!-- Your header content -->
    </header>

    <main>
        <div class="form-container">
            <!-- Your existing form -->
        </div>

        <!-- Add tabs for Monitor Element options -->
        <div class="tab">
            <button class="tablinks" onclick="openTab(event, 'met')">MET vs Phi</button>
            <button class="tablinks" onclick="openTab(event, 'phieta')">Phi vs Eta</button>
        </div>

        <!-- Tab content -->
        <div id="met" class="tabcontent">
            <h3>MET vs Phi</h3>
            <!-- Add content for MET vs Phi here -->
        </div>

        <div id="phieta" class="tabcontent">
            <h3>Phi vs Eta</h3>
            <!-- Add content for Phi vs Eta here -->
            <p>You can add your code for Phi vs Eta plots and options here.</p>
        </div>
    </main>

    <!-- Your existing scripts and closing tags -->

    <script>
        // Function to switch between tabs
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }
    </script>
</body>
</html>
