<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Run Processing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f8f9fa;
      font-size: 1.6em; /* Increased base font size */
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #343a40;
      color: white;
      padding: 30px 60px; /* Increased padding */
      box-sizing: border-box;
    }

    header img {
      height: 90px; /* Increased logo size */
    }

    .help-btn {
      background-color: #007bff;
      color: white;
      padding: 15px 30px; /* Increased button padding */
      font-size: 1.6em; /* Increased font size */
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .help-btn:hover {
      background-color: #0056b3;
    }

    main {
      display: flex;
      justify-content: center;
      padding: 60px 20px;
    }

    .form-container {
      background-color: white;
      padding: 50px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      max-width: 800px; /* Increased max-width */
      width: 100%;
    }

    .form-group {
      margin-bottom: 40px; /* More spacing between groups */
    }

    .form-group label {
      display: block;
      margin-bottom: 20px; /* Increased space */
      font-size: 1.8em; /* Increased label font size */
    }

    select,
    input[type="text"] {
      font-size: 1.6em; /* Increased input font size */
      padding: 18px; /* Increased input padding */
      border: 1px solid #ccc;
      border-radius: 10px;
      width: 100%;
      max-width: 100%;
    }

    .input-with-dropdown {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-top: 10px;
    }

    .input-with-dropdown input {
      flex: 3;
    }

    .input-with-dropdown select {
      flex: 2;
      background-color: #e9ecef;
      padding: 14px;
      font-size: 1.6em; /* Increased font size for dropdown */
    }

    .submit-btn {
      background-color: #28a745;
      color: white;
      padding: 18px 36px; /* Increased button padding */
      font-size: 1.8em; /* Increased font size */
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: block;
      margin: auto;
      margin-top: 50px;
    }

    .submit-btn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='cms_logo.jpg') }}" alt="CMS Logo" />
    <button class="help-btn">Help</button>
  </header>

  <main>
    <div class="form-container">
      <form action="/result" method="post">
        <!-- Monitor Element -->
        <div class="form-group">
          <label for="monitor_element">Monitor Element:</label>
          <select id="monitor_element" name="monitor_element">
            <option value="phieta">Phi vs Eta</option>
            <option value="hadronocc">Hadron Occupancy</option>
            <option value="met">MET</option>
            
          </select>
        </div>

        <!-- Training Run List -->
        <div class="form-group">
          <label for="training_run_list">Training Run List:</label>
          <div class="input-with-dropdown">
            <input type="text" id="training_run_list" name="training_run_list" placeholder="e.g. 368765" />
            <select name="training_call">
              <option value="">2025 Calls</option>
              <option value="call1">Call 1</option>
              <option value="call2">Call 2</option>
              <option value="call3">Call 3</option>
            </select>
          </div>
        </div>

        <!-- Test Run List -->
        <div class="form-group">
          <label for="test_run_list">Test Run List:</label>
          <div class="input-with-dropdown">
            <input type="text" id="test_run_list" name="test_run_list" placeholder="e.g. 368767" />
            <select name="test_call">
              <option value="">2025 Calls</option>
              <option value="call1">Call 1</option>
              <option value="call2">Call 2</option>
              <option value="call3">Call 3</option>
            </select>
          </div>
        </div>

        <button type="submit" class="submit-btn">Submit</button>
      </form>
    </div>
  </main>
</body>
</html>
