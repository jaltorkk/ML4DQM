<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Processing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa; /* Light background */
            font-size: 1.2em; /* Increased default font size */
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #343a40; /* Dark header */
            color: white;
            padding: 15px 20px; /* Increased padding */
            border-radius: 5px;
        }

        header img {
            height: 60px; /* Larger CMS Logo */
        }

        header .help-btn {
            background-color: #007bff;
            color: white;
            padding: 8px 12px; /* Adjusted button padding */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        header .help-btn:hover {
            background-color: #0056b3;
        }

        main {
            margin-top: 20px;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 25px; /* Increased spacing */
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px; /* More spacing */
        }

        .form-group label {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .form-group input,
        .form-group select {
            font-size: 1.2em;
            padding: 12px; /* Increased input padding */
            border: 1px solid #ced4da;
            border-radius: 5px;
            max-width: 400px;
        }

        .submit-btn {
            background-color: #28a745;
            color: white;
            padding: 14px 28px; /* Larger button padding */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
            margin-top: 30px; /* More space above the button */
        }

        .submit-btn:hover {
            background-color: #218838;
        }

        /* Tabs styling */
        .tab {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .tab-label {
            font-size: 1.2em;
            font-weight: bold;
            margin-right: 10px;
        }

        .tab-options {
            display: flex;
            gap: 10px;
        }

        .tab-options a {
            font-size: 1.2em;
            text-decoration: none;
            color: #007bff;
            cursor: pointer;
        }

        .tab-options a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <img src="{{ url_for('static', filename='cms_logo.jpg') }}" alt="CMS Logo">
        </div>
        <button class="help-btn">Help</button>
    </header>

    <main>
        <div class="form-container">
            <form action="/result" method="post">
                <!-- Monitor Element -->
                <div class="form-group">
                    <label for="monitor_element">Monitor Element:</label>
                    <select id="monitor_element" name="monitor_element">
                        <option value="met">MET</option>
                        <option value="phieta">Phi vs Eta</option>
                    </select>
                </div>

                <!-- Training and Test Run Lists -->
                <div class="form-group">
                    <label for="training_run_list">Training Run List:</label>
                    <input type="text" id="training_run_list" name="training_run_list" placeholder="e.g. 368765">
                </div>
                <div class="form-group">
                    <label for="test_run_list">Test Run List:</label>
                    <input type="text" id="test_run_list" name="test_run_list" placeholder="e.g. 368767">
                </div>

                <!-- Tabs for 2025 calls -->
                <div class="tab">
                    <span class="tab-label">2025 Calls:</span>
                    <div class="tab-options">
                        <a href="#">Call 1</a>
                        <a href="#">Call 2</a>
                        <a href="#">Call 3</a>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </main>
</body>
</html>
