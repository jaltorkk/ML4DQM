<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Run Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
            font-size: 1.1em;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #343a40;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
        }

        header img {
            height: 60px;
        }

        header .help-btn {
            background-color: #007bff;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        header .help-btn:hover {
            background-color: #0056b3;
        }

        .content {
            margin-top: 20px;
        }

        .runs {
            margin-bottom: 20px;
        }

        .runs p {
            margin: 8px 0;
            font-weight: bold;
        }

        .warning-box {
            background-color: #fff3cd;
            border-left: 6px solid #ffc107;
            color: #856404;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 5px;
        }

        .images-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .images-row img {
            max-width: 48%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .other-content {
            /* Style any other content here */
        }
    </style>
</head>
<body>
    <header>
        <div>
            <img src="{{ url_for('static', filename='cms_logo.jpg') }}" alt="CMS Logo">
        </div>
        <button class="help-btn">Help</button>
    </header>

    <main class="content">
        <div class="runs">
            <p>Training Runs: {{ training_runs }}</p>
            <p>Test Runs: {{ test_runs }}</p>
        </div>

        {% if warnings %}
        <div class="warning-box">
            {% for warning in warnings %}
                <p>{{ warning }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <div class="images-row">
            {% for image in images %}
                <img src="{{ url_for('static', filename=image) }}" alt="Loss Map">
            {% endfor %}
        </div>

        <div class="other-content">
            <!-- Any remaining elements go here -->
        </div>
    </main>
</body>
</html>
