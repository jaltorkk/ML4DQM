<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f8f9fa;
      font-size: 1.8em; /* Increased base font size */
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #343a40;
      color: white;
      padding: 30px 60px; /* Increased padding */
      box-sizing: border-box;
    }

    header img {
      height: 90px; /* Increased logo size */
    }

    .help-btn {
      background-color: #007bff;
      color: white;
      padding: 15px 30px; /* Increased button padding */
      font-size: 1.6em; /* Increased font size */
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .help-btn:hover {
      background-color: #0056b3;
    }

    main {
      padding: 60px 20px;
      display: flex;
      justify-content: center;
    }

    .results-container {
      background-color: white;
      padding: 50px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      max-width: 1200px; /* Increased max-width */
      width: 100%;
      font-size: 1.6em; /* Increased font size */
    }

    .runs {
      margin-bottom: 40px;
    }

    .runs div {
      margin: 10px 0; /* More spacing between runs */
    }

    .runs strong {
      font-size: 1.8em; /* Larger label text */
    }

    .warnings {
      background-color: #fff3cd;
      color: #856404;
      padding: 30px;
      border: 1px solid #ffeeba;
      border-radius: 12px;
      margin-bottom: 40px;
      font-size: 1.6em; /* Larger warning text */
    }

    .images {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: center;
      margin-top: 50px;
    }

    .images img {
      width: 100%;
      max-width: 600px; /* Larger image size */
      border: 2px solid #ccc;
      border-radius: 15px;
    }

    .footer {
      margin-top: 60px;
      text-align: center;
    }

  </style>
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='cms_logo.jpg') }}" alt="CMS Logo" />
    <button class="help-btn">Help</button>
  </header>

  <main>
    <div class="results-container">
      <div class="runs">
        <div><strong>Training Runs:</strong> {{ training_runs | join(', ') }}</div>
        <div><strong>Test Runs:</strong> {{ test_runs | join(', ') }}</div>
      </div>

      {% if warnings %}
        <div class="warnings">
          {% for warning in warnings %}
            <div>{{ warning.replace("Warning: ", "") }}</div>
          {% endfor %}
        </div>
      {% endif %}

      <div class="images">
        {% for image in images %}
          <img src="{{ url_for('static', filename=image) }}" alt="Loss Map">
        {% endfor %}
      </div>
    </div>
  </main>
</body>
</html>
