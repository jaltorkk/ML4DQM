version: '3.8'
services:
  web:
    build: .
    ports:
      - "8001:8001"
    depends_on:
      - redis
    environment:
      - GUNICORN_PROCESSES=4
      - GUNICORN_THREADS=2
      - GUNICORN_TIMEOUT=5000

  celery:
    build: .
    command: conda run --no-capture-output -n myenv celery -A flask_app.celery worker --loglevel=info
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
